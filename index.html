<body>
<title>أُلفة العائلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap">
<style>
/* Layout: one phone-sized app column, centered on wide screens, full-bleed on phones. */
:root{
  --rose:#C57B88; --rose-strong:#A85E6C; --blush:#FDF1F2; --blush-2:#F8E1E5;
  --ink:#3A2E30; --muted:#7A6A6D; --bg:#FFFFFF; --page:#F6EEEF; --line:#F3E3E6;
  --ok:#3C8A5A; --danger:#C0392B; --on-ink:#FFFFFF;
  --font:"Cairo","Tahoma","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rose:#E59AA7; --rose-strong:#F0B3BE; --blush:#2E2326; --blush-2:#3A2B2F;
  --ink:#F5E9EB; --muted:#BBA8AC; --bg:#1E1719; --page:#141012; --line:#3A2B2F;
  --ok:#7CCB98; --danger:#F08A7E; --on-ink:#1E1719; color-scheme:dark}}
:root[data-theme="dark"]{
  --rose:#E59AA7; --rose-strong:#F0B3BE; --blush:#2E2326; --blush-2:#3A2B2F;
  --ink:#F5E9EB; --muted:#BBA8AC; --bg:#1E1719; --page:#141012; --line:#3A2B2F;
  --ok:#7CCB98; --danger:#F08A7E; --on-ink:#1E1719; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-weight:700;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;font-weight:800;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media (min-width:520px){#app{min-height:calc(100% - 32px);margin-block:16px;border-radius:32px;box-shadow:0 20px 60px rgba(90,40,50,.15);overflow:hidden}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;padding:12px 18px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4,p{margin:0}
h2,h3{text-wrap:balance}

/* Header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:10px}
.hdr .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.hdr img{width:40px;height:40px;border-radius:12px}
.hdr .t{font-size:20px;font-weight:900;color:var(--rose);line-height:1.1}
.hdr .s{font-size:11px;color:var(--muted);font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--rose);flex:none}
.iconbtn:hover{background:var(--blush)}
.iconbtn svg{width:24px;height:24px}

/* Menu */
.menu-back{position:fixed;inset:0;z-index:40}
.menu{position:absolute;top:58px;inset-inline-end:14px;z-index:41;width:220px;background:var(--bg);border:2px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(60,20,30,.18);padding:6px;display:flex;flex-direction:column}
.menu .who{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;border-bottom:2px solid var(--line);margin-bottom:4px}
.menu .who b{color:var(--rose);font-weight:900}
.menu button{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:12px;font-size:14px;text-align:start}
.menu button:hover{background:var(--blush)}
.menu .out{color:var(--danger)}

/* Bottom nav */
.nav{position:absolute;bottom:0;inset-inline:0;z-index:15;background:var(--bg);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:800;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--rose)}
.nav button.on svg{fill:var(--blush-2)}

/* Cards and pieces */
.card{background:var(--blush);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pill{align-self:flex-start;background:var(--rose);color:#fff;font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.h-title{font-size:20px;font-weight:900;color:var(--rose)}
.sub{font-size:13px;color:var(--muted)}
.body{font-size:15px;line-height:1.75;font-weight:700}
.btn{background:var(--ink);color:var(--on-ink);border-radius:22px;padding:15px;font-size:16px;font-weight:900;width:100%}
.btn:disabled{opacity:.5}
.btn.rose{background:var(--rose);color:#fff}
.btn.soft{background:var(--blush-2);color:var(--rose-strong)}
.field{width:100%;background:var(--blush);border:2px solid transparent;border-radius:18px;padding:14px 16px;font-size:15px;outline:none}
.field:focus{border-color:var(--rose)}
.field::placeholder{color:var(--muted);opacity:.8}
.err{color:var(--danger);font-size:13px;font-weight:800;min-height:1em}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:800;z-index:90;max-width:90vw;text-align:center}

/* Splash */
.splash{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20vh 24px 12vh;text-align:center;gap:24px;cursor:pointer}
.splash img{width:150px;height:150px;border-radius:36px;box-shadow:0 14px 40px rgba(197,123,136,.35);animation:pop .9s ease both}
.splash h1{font-size:34px;font-weight:900;color:var(--rose);margin-top:18px}
.splash .en{font-size:18px;color:var(--rose);font-weight:800;letter-spacing:.06em}
.splash .tag{font-size:20px;color:var(--rose);font-weight:800;line-height:1.8}
.splash .skip{font-size:12px;color:var(--muted)}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Login */
.choice{background:var(--blush);border-radius:22px;padding:18px;text-align:start;display:flex;align-items:center;gap:14px;transition:transform .15s}
.choice:active{transform:scale(.98)}
.choice .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--rose)}
.choice .ic svg{width:28px;height:28px}
.choice b{display:block;font-size:18px;font-weight:900;color:var(--rose)}
.choice span{font-size:13px;color:var(--muted)}

/* Avatars */
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.av{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.av .ring{width:64px;height:64px;border-radius:50%;border:3px solid transparent;overflow:hidden;display:grid;place-items:center;transition:transform .15s}
.av.on .ring{border-color:var(--rose);transform:scale(1.06)}
.av.on{color:var(--rose)}
.av .ring svg,.av .ring img{width:100%;height:100%;object-fit:cover}
.av .plus{background:var(--ink);color:var(--on-ink);font-size:28px}
.code{display:flex;justify-content:center;gap:8px;direction:ltr}
.code input{width:44px;height:50px;text-align:center;font-size:20px;font-weight:900;border-radius:14px;background:var(--blush);border:2px solid transparent;outline:none;color:var(--rose)}
.code input:focus{border-color:var(--rose)}

/* Home */
.mood{display:flex;align-items:center;gap:14px;background:var(--blush);border-radius:22px;padding:16px;text-align:start}
.mood .face{width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.mood .face svg{width:40px;height:40px}
.mood b{font-size:18px;font-weight:900;color:var(--rose);display:block}
.mood span{font-size:13px;color:var(--muted)}
.chev{margin-inline-start:auto;color:var(--rose);font-size:22px}

/* Consult */
.chatbar{display:flex;align-items:flex-end;gap:8px;background:var(--ink);border-radius:26px;padding:8px}
.chatbar textarea{flex:1;background:transparent;border:0;outline:none;color:var(--on-ink);resize:none;font-size:15px;padding:8px 10px;max-height:120px;line-height:1.6}
.chatbar textarea::placeholder{color:var(--on-ink);opacity:.55}
.send{width:42px;height:42px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
[dir="rtl"] .send svg{transform:scaleX(-1)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.msg.me{align-self:flex-start;background:var(--rose);color:#fff;border-start-start-radius:6px}
.msg.ai{align-self:flex-end;background:var(--blush);border-start-end-radius:6px}
.faq{background:var(--blush);border-radius:16px;overflow:hidden}
.faq>button{width:100%;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;font-size:14px}
.faq>button i{font-style:normal;color:var(--rose);transition:transform .2s}
.faq.open>button i{transform:rotate(180deg)}
.faq p{padding:0 16px 14px;font-size:14px;line-height:1.75;color:var(--muted)}
.sec-t{font-size:15px;font-weight:900;color:var(--rose)}

/* Activities */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--blush);padding:4px;border-radius:16px}
.tabs button{padding:9px;border-radius:12px;font-size:15px;font-weight:900;color:var(--rose)}
.tabs button.on{background:var(--rose);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:var(--blush);border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:168px;position:relative}
.act .em{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:22px}
.act h4{font-size:14px;font-weight:900;line-height:1.4}
.act small{font-size:11px;color:var(--rose);font-weight:800}
.act .foot{margin-top:auto;font-size:11px;color:var(--muted);border-top:2px solid var(--line);padding-top:6px;width:100%}
.act .done{position:absolute;top:8px;inset-inline-start:8px;background:var(--ok);color:#fff;font-size:10px;padding:2px 8px;border-radius:999px}
.weekbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

/* Sheet modal */
.sheet-back{position:fixed;inset:0;background:rgba(40,20,25,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--blush);border-radius:16px;padding:13px 16px;text-align:start;font-size:15px;border:2px solid transparent}
.opt.right{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--danger);color:var(--danger)}
.prog{height:8px;border-radius:99px;background:var(--blush);overflow:hidden}
.prog i{display:block;height:100%;background:var(--rose);transition:width .3s}

/* Family + profile */
.digits{display:flex;gap:6px;direction:ltr}
.digits span{width:36px;height:40px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.members{display:flex;gap:14px;overflow-x:auto;padding-block:4px}
.member{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;flex:none}
.member .ring{width:58px;height:58px;border-radius:50%;overflow:hidden}
.member .ring svg,.member .ring img{width:100%;height:100%;object-fit:cover}
.stat{display:flex;justify-content:space-between;align-items:center;background:var(--blush);border-radius:18px;padding:14px 16px}
.stat b{font-size:24px;font-weight:900;color:var(--rose);font-variant-numeric:tabular-nums}
.quote{text-align:center;font-size:16px;color:var(--rose);font-weight:800;line-height:1.8;padding:6px 10px}
.phrase{background:var(--blush);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.phrase .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phrase .top b{font-size:14px;font-weight:900}
.copy{background:var(--bg);color:var(--rose);font-size:12px;font-weight:900;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:4px;flex:none}
.phrase p{font-size:15px;line-height:1.8;user-select:text}
.profile-top{display:flex;align-items:center;gap:14px;background:var(--blush);border-radius:22px;padding:16px}
.profile-top .ring{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none}
.profile-top .ring svg,.profile-top .ring img{width:100%;height:100%;object-fit:cover}
.thinking{color:var(--rose);font-size:13px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.linkbtn{color:var(--rose);font-weight:900;text-decoration:underline;padding:2px 4px;font-size:inherit}
.center{text-align:center}
.member{position:relative}
.member .ring{border:3px solid transparent}
.member.on .ring{border-color:var(--ok)}
.member.off .ring{opacity:.6}
.member .dot{position:absolute;top:2px;inset-inline-end:2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.member small{font-size:10px;color:var(--muted)}
.member.on small{color:var(--ok)}
.hist{background:var(--blush);border-radius:16px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:2px}
.hist small{color:var(--muted);font-size:12px}
</style>

  if(kind==="daughter"){
    behind=`<circle cx="26" cy="38" r="9" fill="${P.hair}"/><circle cx="74" cy="38" r="9" fill="${P.hair}"/>`;
    hairTop=`<path d="M28 48 Q26 22 50 22 Q74 22 72 48 Q66 32 50 34 Q36 32 28 48Z" fill="${P.hair}"/><path d="M68 28 l8 -6 l1 10Z M68 28 l-2 -9 l9 3Z" fill="#E86C8A"/>`;
  }
  const eyes="";

const AI_URL="https://olfa-ai.aljouriabushal.workers.dev/";
async function serverAI(task,payload){
  if(!AI_URL||AI_URL.startsWith("__"))throw{code:"none"};
  const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task,lang:S.lang,...payload})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.text)throw{code:r.status===429?"rate_limited":"upstream_error"};
  return d.text;
}
const hasServer=()=>!!AI_URL&&!AI_URL.startsWith("__");
async function api(action,payload){
  if(!hasServer())throw{code:"none"};
  let r;try{r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...payload})})}catch(e){throw{code:"net"}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:d.error||"net"};
  return d;
}

async function sha(txt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "p:"+txt.length+":"+[...txt].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)}}

let aiBlocked=false;
let aiState=window.claude?.use?"unknown":"outside";
let permsP=null;const getPerms=()=>permsP??=(window.claude?.use?window.claude.use("permissions").catch(()=>null):Promise.resolve(null));
async function refreshAi(){const p=await getPerms();if(!p){aiState=hasServer()?"server":window.claude?"unavailable":"outside";}else{try{aiState=await p.state("sample")}catch(e){aiState="unavailable"}}aiBlocked=aiState==="denied"||aiState==="unavailable"||aiState==="outside";if(screen==="consult"||menuOpen)render()}
async function turnOnAi(){
  if(aiState==="outside"||aiState==="unavailable"){toast(t("aiOutside"));return}
  const p=await getPerms();if(!p){toast(t("aiOutside"));return}
  try{
    if(aiState==="denied"){await p.manage()}else{await p.request(["sample"])}
  }catch(e){toast(t("aiDenied"))}
  await refreshAi();if(aiState==="granted")toast(t("aiReady"));
}

  const msg=aiState==="outside"||aiState==="unavailable"?t("aiOutside"):aiState==="denied"?t("aiDenied"):t("aiAsk");

}

/* ---------- sheet (modal) ---------- */
let sheetHTML="",sheetCtx=null;
function openSheet(html,ctx){sheetHTML=html;sheetCtx=ctx||null;render()}
function closeSheet(){sheetHTML="";sheetCtx=null;render()}
function sheetHead(title){return `<div class="row between"><h3 class="h-title" style="font-size:18px">${title}</h3><button class="copy" data-act="sheet-x">${t("close")} ×</button></div>`}

function playQuiz(id){
  const q=QUIZZES[id];let i=0,score=0,picked=null;
  const draw=()=>{
    if(i>=q.q.length){
      const earned=score*5;const first=!S.done[doneKey(id)];
      if(first){S.done[doneKey(id)]=true;addPoints(earned)}
      openSheet(`${sheetHead(L(q.t))}<div class="card" style="text-align:center;align-items:center"><span style="font-size:44px">🎉</span><p class="body">${t("result")}: ${score} / ${q.q.length} ${t("correct")}</p><p class="h-title">${first?`${t("earned")} ${earned} ${t("pts")}`:t("done")}</p></div><button class="btn" data-act="sheet-x">${t("close")}</button>`);
      return;
    }
    const x=L(q.q[i]);const a=q.q[i].a;
    openSheet(`${sheetHead(L(q.t))}<div class="prog"><i style="width:${(i/q.q.length)*100}%"></i></div><p class="sub">${t("qOf")} ${i+1} / ${q.q.length}</p><p class="body" style="font-size:18px">${x[0]}</p>
      <div class="opts">${x[1].map((o,j)=>`<button class="opt ${picked!==null?(j===a?"right":j===picked?"wrong":""):""}" data-opt="${j}" ${picked!==null?"disabled":""}>${o}</button>`).join("")}</div>
      ${picked!==null?`<button class="btn" data-act="qnext">${i===q.q.length-1?t("finish"):t("next")}</button>`:""}`,{type:"quiz",pick:j=>{if(picked!==null)return;picked=j;if(j===a)score++;draw()},next:()=>{i++;picked=null;draw()}});
  };
  draw();
}

async function evalWisdom(){
  const ta=$("#wIn"),err=$("#wErr"),out=$("#wOut"),btn=$("#wBtn");
  const txt=ta.value.trim();
  if(txt.length<10){err.textContent=t("wisdomMin");ta.focus();return}
  err.textContent="";btn.disabled=true;ta.disabled=true;out.innerHTML=`<p class="thinking">${t("evaluating")}</p>`;
  let feedback,points=20;
  try{
    const s=await getSample();let r;
    if(!s){const raw=await serverAI("wisdom",{text:txt.slice(0,600)});const m=raw.match(/\{[\s\S]*\}/);r=JSON.parse(m?m[0]:raw)}
    else r=await s.json(`You are the warm judge in "Olfa", a family-bonding app. A family member wrote this saying/wisdom:\n"""${txt.slice(0,600)}"""\nReply with only JSON: {"feedback": string, "points": number}. feedback: 1-2 short, warm sentences in ${S.lang==="ar"?"simple Arabic (Saudi-friendly)":"simple English"} about the saying. points: an integer 15-30 based on how meaningful and kind it is. If the text is not a real saying or is unkind, give 5 points and gently encourage a better one.`,{modelTier:"quick",cache:false});
    feedback=String(r.feedback||"");points=Math.max(5,Math.min(30,parseInt(r.points)||20));
  }catch(e){
    feedback=S.lang==="ar"?"حكمة جميلة تقرّب القلوب، شكراً لمشاركتك!":"A lovely saying that brings hearts closer. Thanks for sharing!";points=20;
  }
  S.wisdomDay=dayNo();addPoints(points);
  out.innerHTML=`<div class="card"><p class="body">${esc(feedback)}</p><p class="h-title">+${points} ${t("pts")}</p></div>`;
  btn.textContent=t("close");btn.disabled=false;btn.dataset.act="sheet-x";
}

/* ---------- chat ---------- */
const RULES=()=>`You are "Olfa" (أُلفة), a warm family-guidance helper inside the Olfa Family app. Reply in ${S.lang==="ar"?"simple, warm Arabic (Saudi-friendly, easy to read)":"simple, warm English"}. Keep replies short for a phone screen (3-6 sentences or a few short points). Listen first, validate feelings, then give 1-3 gentle practical steps rooted in kindness, respect between family members and good Islamic and Saudi family values. Never judge or blame. The person may be a teenager or a parent. If the person mentions being hurt, abuse, wanting to harm themselves or others, or being in danger, gently urge them to talk now to a trusted adult and to call 911 (Saudi emergency) if in immediate danger. You are not a doctor or therapist; for serious or ongoing issues suggest a family counselor.`;
async function sendChat(){
  const ta=$("#chatIn");const txt=ta.value.trim();if(!txt||thinking)return;
  let chat=currentChat();
  if(!chat){chat={id:Date.now().toString(36),at:Date.now(),messages:[]};S.chats.push(chat);chatId=chat.id}
  chat.messages.push({role:"user",content:txt});save();
  thinking=true;render();
  const s=await getSample();
  if(!s){
    if(hasServer()){
      try{chat.messages.push({role:"assistant",content:(await serverAI("chat",{messages:chat.messages.slice(-12)})).trim()})}
      catch(e){chat.messages.push({role:"assistant",content:t("aiErr")})}
    }else chat.messages.push({role:"assistant",content:t("aiOutside")});
    thinking=false;save();render();$("#msgs")?.lastElementChild?.scrollIntoView({block:"nearest"});if(!hasServer())refreshAi();return}
  let bubble=null;
  try{
    const turns=[{role:"user",content:RULES()},...chat.messages.slice(-12)];
    const r=await s(turns,{cache:false,modelTier:"quick",onText:({text})=>{if(!bubble){bubble=$("#msgs .thinking");if(bubble)bubble.classList.remove("thinking")}if(bubble)bubble.textContent=text}});
    chat.messages.push({role:"assistant",content:r.text.trim()});
  }catch(e){
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){chat.messages.push({role:"assistant",content:t("aiDenied")});refreshAi()}
    else chat.messages.push({role:"assistant",content:e?.text||t("aiErr")});
  }
  thinking=false;save();render();
  const m=$("#msgs");m?.lastElementChild?.scrollIntoView({block:"nearest"});
}

/* ---------- weekly report ---------- */
let reportBusy=false;
async function ensureReport(){
  if(screen!=="family"||S.user?.mode==="individual_path"||reportBusy)return;
  if(S.report&&S.report.week===weekNo()&&S.report.lang===S.lang)return;
  reportBusy=true;
  const wk=weekNo();const daysDone=Object.keys(S.done).filter(k=>Math.floor((+k.split(":")[0]+4)/7)===wk);
  const chatsWeek=S.chats.filter(c=>Math.floor((Math.floor((c.at+3*3600e3)/86400e3)+4)/7)===wk).length;
  const stats=`Family points: ${S.familyPoints}. Activities and challenges completed this week: ${daysDone.length}. Support chats opened this week: ${chatsWeek}. Wisdom game played this week: ${S.wisdomDay&&Math.floor((S.wisdomDay+4)/7)===wk?"yes":"no"}.`;
  let text;
  try{
    const s=await getSample();
    if(!s)text=(await serverAI("report",{text:stats})).trim();
    else text=(await s(`Write the weekly family report for the "Olfa" family app in ${S.lang==="ar"?"warm, simple Arabic":"warm, simple English"}. 2-3 short sentences, no headings, no lists. Base it only on these numbers, celebrate effort, and end with one gentle, specific idea for the coming week. Never mention private chat content.\n${stats}`,{modelTier:"quick",cache:{gcTime:86400000}})).text.trim();
  }catch(e){
    text=S.lang==="ar"?`أسبوع جميل بإذن الله. أنجزتم ${daysDone.length} من الأنشطة والتحديات، ورصيد العائلة ${S.familyPoints} نقطة. جرّبوا هذا الأسبوع جلسة إنصات قصيرة بدون جوالات.`:`A lovely week. You completed ${daysDone.length} activities and challenges, and your family has ${S.familyPoints} points. This week, try a short phone-free listening time together.`;
  }
  S.report={week:wk,lang:S.lang,text};save();reportBusy=false;
  const el=$("#report");if(el)el.textContent=text;
}

/* ---------- events ---------- */
function after(){
  if(screen==="register"){
    const bind=(id,k)=>{const el=$("#"+id);el&&el.addEventListener("input",()=>reg[k]=el.value)};
    bind("r-name","name");bind("r-user","username");bind("r-age","age");bind("r-role","role");bind("r-pass","pass");bind("r-pass2","pass2");
    reg.code.forEach((_,i)=>{const el=$("#code-"+i);if(!el)return;
      el.addEventListener("input",()=>{el.value=el.value.replace(/\D/g,"").slice(-1);reg.code[i]=el.value;if(el.value&&i<5)$("#code-"+(i+1)).focus()});
      el.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!el.value&&i>0)$("#code-"+(i-1)).focus()});
      el.addEventListener("paste",e=>{const d=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);if(d.length){e.preventDefault();d.split("").forEach((c,j)=>{reg.code[j]=c;$("#code-"+j).value=c});$("#code-"+Math.min(d.length,5)).focus()}})});
    $("#r-photo")?.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const g=c.getContext("2d");const m=Math.min(img.width,img.height);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,160,160);reg.photo=c.toDataURL("image/jpeg",.8);render()};img.src=fr.result};fr.readAsDataURL(f)});
    $("#regForm").addEventListener("submit",e=>{e.preventDefault();
      const err=$("#r-err");
      if(!reg.name.trim()){err.textContent=t("eName");return}
      const uname=reg.username.trim().toLowerCase();
      if(!/^[a-z0-9_.]{3,20}$/.test(uname)){err.textContent=t("eUser");return}
      if(reg.pass.length<4){err.textContent=t("ePass");return}
      if(regMode!=="family_code"&&reg.pass!==reg.pass2){err.textContent=t("eMatch");return}
      if(regMode==="family_code"&&reg.code.join("").length!==6){err.textContent=t("eCode");return}
      const profile={name:reg.name.trim(),age:reg.age,role:reg.role.trim()||(reg.avatar?T[S.lang].roles[reg.avatar]:""),avatar:reg.avatar||"son",photo:reg.photo,mode:regMode};
      const btn=$("#r-btn");btn.disabled=true;err.textContent="";
      (async()=>{
        try{
          if(hasServer()){
            const d=await api("register",{username:uname,password:reg.pass,...profile,code:reg.code.join(""),points:10});
            S.token=d.token;S.user=d.user;S.points=d.user.points;S.familyPoints=d.user.points;S.members=null;
          }else{
            if(S.accounts[uname])throw{code:"username_taken"};
            const code=regMode==="family_code"?reg.code.join(""):regMode==="family_space"?String(Math.floor(100000+Math.random()*900000)):"";
            S.user={...profile,username:uname,code};S.points=10;S.familyPoints=10;S.done={};S.wisdomDay=null;
            S.accounts[uname]={pass:await sha(uname+":"+reg.pass),user:S.user,points:10};
          }
          save();go("home");refreshFamily();
        }catch(e){err.textContent=errText(e);btn.disabled=false}
      })();
    });
  }
  if(screen==="signin"){
    const u=$("#s-user"),p=$("#s-pass");u.addEventListener("input",()=>sign.username=u.value);p.addEventListener("input",()=>sign.pass=p.value);
    $("#signForm").addEventListener("submit",e=>{e.preventDefault();
      const err=$("#s-err"),btn=$("#s-btn");const uname=sign.username.trim().toLowerCase();
      if(!uname||!sign.pass){err.textContent=t("eWrong");return}
      btn.disabled=true;err.textContent="";
      (async()=>{
        try{
          if(hasServer()){
            const d=await api("login",{username:uname,password:sign.pass});
            S.token=d.token;S.user=d.user;S.points=d.user.points;S.members=d.members||null;S.familyPoints=d.familyPoints??d.user.points;
          }else{
            const a=S.accounts[uname];
            if(!a||a.pass!==await sha(uname+":"+sign.pass))throw{code:"wrong_login"};
            S.user=a.user;S.points=a.points||0;S.familyPoints=S.points;
          }
          sign={username:"",pass:""};save();go("home");
        }catch(e){err.textContent=errText(e);btn.disabled=false}
      })();
    });
  }
  if(screen==="consult"){const ta=$("#chatIn");ta?.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat()}});ta?.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"})}
  if(screen==="family"){ensureReport();refreshFamily()}
}
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-go],[data-reg],[data-av],[data-faq],[data-tab],[data-play],[data-ch],[data-opt],[data-copy],[data-chat]");
  if(!el){return}
  const d=el.dataset;
  if(d.act==="sheet-close"&&e.target!==el)return; // clicks inside the sheet
  if(d.go){if(!S.user)return;go(d.go);return}
  if(d.reg){regMode=d.reg;reg={username:"",name:S.user?.name||"",age:S.user?.age||"",role:S.user?.role||"",pass:"",pass2:"",code:["","","","","",""],avatar:S.user?.avatar||null,photo:S.user?.photo||null};go("register");return}
  if(d.av){reg.avatar=d.av;reg.photo=null;if(!reg.role||Object.values(T.ar.roles).concat(Object.values(T.en.roles)).includes(reg.role))reg.role=t("roles")[d.av];render();return}
  if(d.faq!==undefined){openFaq=openFaq===+d.faq?null:+d.faq;render();return}
  if(d.tab){actTab=d.tab;render();return}
  if(d.play){d.play==="wisdom"?playWisdom():playQuiz(d.play);return}
  if(d.ch){openChallenge(d.ch);return}
  if(d.opt!==undefined){sheetCtx?.pick(+d.opt);return}
  if(d.copy!==undefined){copyText(L(PHRASES[+d.copy])[1]);return}
  if(d.chat){chatId=d.chat;sheetHTML="";go("consult");return}
  switch(d.act){
    case "skip":clearTimeout(splashTimer);go(S.user?"home":"login");break;
    case "menu":menuOpen=!menuOpen;render();break;
    case "menu-close":menuOpen=false;render();break;
    case "lang":S.lang=S.lang==="ar"?"en":"ar";menuOpen=false;save();render();break;
    case "logout":
      if(S.token)api("logout",{token:S.token}).catch(()=>{});
      if(!hasServer()&&S.user?.username&&S.accounts[S.user.username])Object.assign(S.accounts[S.user.username],{user:S.user,points:S.points});
      S.user=null;S.token=null;S.members=null;chatId=null;menuOpen=false;save();go("login");break;
    case "toSignin":go("signin");break;
    case "history":menuOpen=false;openHistory();break;
    case "back":go("login");break;
    case "sug":sugOpen=!sugOpen;render();break;
    case "send":sendChat();break;
    case "aiOn":menuOpen=false;turnOnAi();break;
    case "newchat":chatId=null;render();$("#chatIn")?.focus();break;
    case "sheet-close":case "sheet-x":closeSheet();break;
    case "qnext":sheetCtx?.next();break;
    case "wEval":evalWisdom();break;
    case "chDo":S.done[doneKey(d.id)]=true;addPoints(10);openChallenge(d.id);break;
    case "sharecode":copyText((S.lang==="ar"?"انضم لعائلتي في تطبيق أُلفة بهذا الكود: ":"Join my family on the Olfa app with this code: ")+S.user.code);break;
    case "toFam":openSheet(`${sheetHead(t("makeFam"))}<p class="body">${t("makeFamQ")}</p><p class="err" id="f-err"></p><button class="btn rose" data-act="famCreate" id="f-btn">${t("create")}</button>`);break;
    case "toJoin":openSheet(`${sheetHead(t("joinFam"))}<input class="field" id="j-code" inputmode="numeric" maxlength="6" dir="ltr" placeholder="${t("codeLabel")}" style="text-align:center;font-size:22px;letter-spacing:.3em"><p class="err" id="f-err"></p><button class="btn rose" data-act="famJoin" id="f-btn">${t("joinBtn")}</button>`);break;
    case "famCreate":case "famJoin":setFamily(d.act==="famCreate");break;
  }
});

async function setFamily(create){
  const err=$("#f-err"),btn=$("#f-btn");const code=create?"":($("#j-code")?.value||"").replace(/\D/g,"");
  if(!create&&code.length!==6){err.textContent=t("eCode");return}
  btn.disabled=true;err.textContent="";
  try{
    if(hasServer()&&S.token){
      const d=await api("setFamily",{token:S.token,mode:create?"family_space":"family_code",code});
      S.user=Object.assign({},S.user,{mode:d.user.mode,code:d.user.code});S.members=d.members;S.familyPoints=d.familyPoints;
    }else{
      S.user=Object.assign({},S.user,{mode:create?"family_space":"family_code",code:create?String(Math.floor(100000+Math.random()*900000)):code});
    }
    save();closeSheet();toast(create?t("famCreated"):t("joined"));
  }catch(e){err.textContent=errText(e);btn.disabled=false}
}
setInterval(()=>{if(document.visibilityState==="visible"&&S.token){if(screen==="family"||Date.now()-(window.__lastPing||0)>170000){window.__lastPing=Date.now();refreshFamily()}}},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.token)refreshFamily()});

/* ---------- boot ---------- */
render();
refreshAi();
if(S.token)refreshFamily();
const splashTimer=setTimeout(()=>{if(screen==="splash")go(S.user?"home":"login")},8000);
})();
</script>
